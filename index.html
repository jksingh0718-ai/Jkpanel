<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JK PANEL SHOP</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#0b0f19;color:#fff;padding:12px;padding-bottom:90px}
.top-header{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:1px solid #1f293d;gap:8px}
.btn-menu{background:#1e293b;color:#38bdf8;border:1px solid #334155;font-size:20px;padding:6px 12px;border-radius:8px}
.btn-contact{background:#064e3b;color:#34d399;border:1px solid #059669;font-size:11px;font-weight:bold;padding:8px 12px;border-radius:8px;text-decoration:none}
.btn-deposit-top{background:#dc2626;color:#fff;font-size:11px;font-weight:bold;padding:8px 12px;border:0;border-radius:8px}
.box{background:#111827;border-radius:12px;padding:14px;margin-top:14px}
.box-green{border:1px solid #10b981}.box-purple{border:1px solid #a855f7}
.box-blue{border:1px solid #3b82f6}.box-orange{border:1px solid #f97316}.box-cyan{border:1px solid #06b6d4}
.btn-action{display:block;width:100%;text-align:center;padding:10px;margin-top:10px;border-radius:8px;font-weight:bold;font-size:12px;text-decoration:none;border:0;cursor:pointer}
.btn-upgrade{background:#10b981;color:#000}.btn-channel{background:#581c87;color:#f3e8ff;border:1px solid #a855f7}
.stats-container{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.stat-number{font-size:26px;font-weight:bold}.stat-text{font-size:11px;color:#94a3b8;font-weight:bold;margin-top:4px}
.product-card{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#111827;border:1px solid #1f293d;padding:12px;border-radius:10px;margin-top:8px}
.product-card img{width:55px;height:55px;object-fit:cover;border-radius:7px}
.product-info{flex:1;min-width:0}.product-name{font-size:13px;font-weight:bold;overflow-wrap:anywhere}
.product-price{font-size:12px;color:#38bdf8;font-weight:bold;margin-top:5px}
.btn-buy-link{background:#06b6d4;color:#000;padding:8px 12px;border-radius:6px;font-size:11px;font-weight:bold;text-decoration:none;white-space:nowrap}
.whatsapp-float{position:fixed;bottom:20px;right:20px;width:52px;height:52px;border-radius:50%;background:#25d366;color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;text-decoration:none;z-index:50}
#sidebarMenu{display:none;position:fixed;top:0;left:0;width:260px;max-width:85%;height:100%;overflow-y:auto;background:#0f172a;border-right:1px solid #334155;padding:16px;z-index:100}
#menuBackdrop{display:none;position:fixed;inset:0;background:#000b;z-index:99}
.menu-item{display:block;color:#e2e8f0;text-decoration:none;padding:12px 0;font-size:13px;border-bottom:1px solid #1e293b}
#qrPopup{display:none;position:fixed;inset:0;background:#000d;z-index:200;align-items:center;justify-content:center;padding:16px}
.qr-card{background:#0f172a;border:1px solid #10b981;padding:20px;border-radius:14px;text-align:center;max-width:320px;width:100%}
.qr-card img{width:160px;height:160px;object-fit:contain;display:block}
.muted{font-size:12px;color:#94a3b8;line-height:1.5}
@media(max-width:360px){.btn-contact{padding:8px;font-size:10px}.btn-deposit-top{padding:8px;font-size:10px}.product-card{padding:9px}}
</style>
</head>
<body>

<div id="menuBackdrop" onclick="closeSidebar()"></div>

<div id="sidebarMenu">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <span style="font-weight:bold;color:#06b6d4;font-size:18px">JK PANEL SHOP</span>
    <button onclick="closeSidebar()" style="background:none;border:0;color:white;font-size:20px">✕</button>
  </div>
  <a href="#" class="menu-item" onclick="closeSidebar()">Dashboard</a>
  <a href="javascript:void(0)" class="menu-item" onclick="closeSidebar();showQR()">Deposit</a>
  <a href="#servicesList" class="menu-item" onclick="closeSidebar()">Buy Keys / Products</a>
  <a href="javascript:void(0)" class="menu-item" onclick="support('My Resellers')">My Resellers</a>
  <a href="javascript:void(0)" class="menu-item" onclick="support('My Keys')">My Keys</a>
  <a href="javascript:void(0)" class="menu-item" onclick="support('Order History')">History</a>
  <a id="supportMenu" href="#" target="_blank" rel="noopener" class="menu-item">Support Ticket</a>
  <a href="javascript:void(0)" class="menu-item" onclick="support('Refer And Earn')">Refer And Earn</a>
  <a href="javascript:void(0)" class="menu-item" onclick="support('API And Password')">API And Password</a>
</div>

<header class="top-header">
  <div style="display:flex;gap:8px;align-items:center">
    <button class="btn-menu" onclick="openSidebar()" aria-label="Menu">☰</button>
    <a id="contactBtn" href="#" target="_blank" rel="noopener" class="btn-contact">CONTACT</a>
  </div>
  <button class="btn-deposit-top" onclick="showQR()">▶ HOW TO DEPOSIT?</button>
</header>
